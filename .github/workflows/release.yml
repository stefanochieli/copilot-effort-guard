name: release

# Rilascio automatico: al merge su main (PR develop -> main) crea il tag e la release
# della versione in testa a CHANGELOG.md, se il tag non esiste gia'.
on:
  push:
    branches: [main]
  # A mano: rilancia il rilascio se GitHub non ha consegnato l'evento di push (tag mancante).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.ver.outputs.exists == 'false' }}
      tag_name: v${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Versione dal CHANGELOG
        id: ver
        run: |
          v=$(grep -m1 -oE '^## \[[0-9]+(\.[0-9]+)+\]' CHANGELOG.md | grep -oE '[0-9]+(\.[0-9]+)+')
          test -n "$v" || { echo "Nessuna voce ## [X.Y.Z] nel CHANGELOG"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "Il tag v$v esiste gia': niente da rilasciare."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Crea release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## \[/{ if (p) exit; if (index($0,"["v"]")) p=1 } p' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi

  # Runs only when a release was just tagged: builds the VS Code extension,
  # attaches the .vsix to the GitHub Release and, if the secret VSCE_PAT is set,
  # publishes it to the Visual Studio Marketplace.
  publish-extension:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package the extension
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies -o "$GITHUB_WORKSPACE/copilot-effort-guard-status.vsix"
      - name: Attach the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" copilot-effort-guard-status.vsix --clobber
      - name: Publish to the Marketplace
        if: ${{ env.HAS_VSCE_PAT == 'true' }}
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath "$GITHUB_WORKSPACE/copilot-effort-guard-status.vsix"

  # Runs only when a release was just tagged: builds the IntelliJ plugin, attaches
  # the zip to the GitHub Release (install it with Settings | Plugins | Install Plugin from Disk)
  # and, if the secret JETBRAINS_PUBLISH_TOKEN is set, publishes it to the JetBrains Marketplace.
  publish-intellij-plugin:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      HAS_JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the plugin
        working-directory: intellij-plugin
        run: ./gradlew --no-daemon buildPlugin
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" intellij-plugin/build/distributions/*.zip --clobber
      - name: Publish to the JetBrains Marketplace
        if: ${{ env.HAS_JETBRAINS_TOKEN == 'true' }}
        working-directory: intellij-plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: ./gradlew --no-daemon publishPlugin
