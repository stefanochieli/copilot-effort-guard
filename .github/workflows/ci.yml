name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JSON syntax
        run: node -e "JSON.parse(require('fs').readFileSync('.github/hooks/effort-guard.json','utf8'))"
      - run: npm test
