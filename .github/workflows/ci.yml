name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Manual run (e.g. on the release PR branch when it was opened with GITHUB_TOKEN,
  # which does not trigger pull_request workflows).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: JSON syntax
        run: |
          for f in .github/hooks/effort-guard.json vscode-extension/package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done
      - name: JavaScript syntax
        run: |
          for f in src/*.mjs scripts/*.mjs vscode-extension/*.js; do
            node --check "$f" && echo "ok $f"
          done
      - run: npm test
      - name: Selftest
        run: node src/effort-guard.mjs selftest

  # Packages the VS Code extension exactly as the release does, so a broken manifest or
  # bundle shows up on the pull request and not after the tag. Not a required check.
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package the extension
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies -o "$RUNNER_TEMP/copilot-effort-guard-status.vsix"
      - name: The bundled hooks are in the package
        run: unzip -l "$RUNNER_TEMP/copilot-effort-guard-status.vsix" | grep -q 'extension/hooks/src/effort-guard.mjs'

  # The hooks run on Windows too (PowerShell, backslash paths, Node installed by the MSI):
  # the same tests on windows-latest, on the Node versions the package declares (>=20).
  # Not a required check: the required one is `checks` above.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Selftest
        run: node src/effort-guard.mjs selftest

  # Builds and tests the IntelliJ plugin (needs the IntelliJ Platform, downloaded by Gradle).
  intellij-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build the plugin
        working-directory: intellij-plugin
        run: ./gradlew --no-daemon test buildPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: intellij-plugin/build/distributions/*.zip
