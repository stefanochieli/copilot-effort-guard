name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by auto-release.yml on the release PR branch: a PR opened with
  # GITHUB_TOKEN does not trigger pull_request workflows, so without this the
  # required "checks" would never run on it.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JSON syntax
        run: |
          for f in .github/hooks/effort-guard.json release-config.json release-manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done
      - run: npm test
      - name: Selftest
        run: node src/effort-guard.mjs selftest

  # The hooks run on Windows too (PowerShell, backslash paths, Node installed by the MSI):
  # the same tests on windows-latest, on the Node versions the package declares (>=20).
  # Not a required check: the required one is `checks` above.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Selftest
        run: node src/effort-guard.mjs selftest

  # Builds and tests the IntelliJ plugin (needs the IntelliJ Platform, downloaded by Gradle).
  intellij-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the plugin
        working-directory: intellij-plugin
        run: ./gradlew --no-daemon test buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: intellij-plugin/build/distributions/*.zip
