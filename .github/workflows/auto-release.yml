name: Auto release
on:
  push:
    branches: [main]
  # Manual run: recovers a release when GitHub did not deliver the push event of the
  # merged release PR (no tag was created). release-please then tags and publishes.
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    env:
      # Secrets cannot be read in a step's `if`; expose only whether it is set.
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Optional: with a PAT or GitHub App token (secret RELEASE_PLEASE_TOKEN)
          # the release PR triggers the normal pull_request workflows by itself.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-config.json
          manifest-file: release-manifest.json
      # prs_created is true only when a release PR was created or updated.
      # A PR opened or updated with GITHUB_TOKEN does not trigger CI, and the
      # ruleset requires the "checks" status. Dispatch CI on the release branch:
      # its check run attaches to the PR head commit.
      - name: Run CI on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job: tell gh which repository to act on.
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<< "$PR_JSON")
          if [ -z "$branch" ]; then
            echo "No release branch in the action output; nothing to dispatch."
            exit 0
          fi
          gh workflow run ci.yml --ref "$branch"
      # Releases go out on their own when RELEASE_PLEASE_TOKEN is set: GitHub
      # merges the release PR once the required checks pass, and because the
      # merge is made with a PAT it triggers this workflow again, which tags
      # and publishes. With only GITHUB_TOKEN the merge would not trigger it
      # (no tag), so without the secret the release PR is merged by hand.
      - name: Auto-merge the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' && env.HAS_RELEASE_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r '.number // empty' <<< "$PR_JSON")
          if [ -z "$number" ]; then
            echo "No release PR number in the action output; nothing to merge."
            exit 0
          fi
          gh pr merge "$number" --auto --merge

  # Runs only when a release was just tagged: builds the VS Code extension,
  # attaches the .vsix to the GitHub Release and, if the secret VSCE_PAT is set,
  # publishes it to the Visual Studio Marketplace.
  publish-extension:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package the extension
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies -o "$GITHUB_WORKSPACE/copilot-effort-guard-status.vsix"
      - name: Attach the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" copilot-effort-guard-status.vsix --clobber
      - name: Publish to the Marketplace
        if: ${{ env.HAS_VSCE_PAT == 'true' }}
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath "$GITHUB_WORKSPACE/copilot-effort-guard-status.vsix"

  # Runs only when a release was just tagged: builds the IntelliJ plugin, attaches
  # the zip to the GitHub Release (install it with Settings | Plugins | Install Plugin from Disk)
  # and, if the secret JETBRAINS_PUBLISH_TOKEN is set, publishes it to the JetBrains Marketplace.
  publish-intellij-plugin:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      HAS_JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the plugin
        working-directory: intellij-plugin
        run: ./gradlew --no-daemon buildPlugin
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" intellij-plugin/build/distributions/*.zip --clobber
      - name: Publish to the JetBrains Marketplace
        if: ${{ env.HAS_JETBRAINS_TOKEN == 'true' }}
        working-directory: intellij-plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: ./gradlew --no-daemon publishPlugin
